# Metaspace поднят: на 8 модулях lint и javac в одном демоне упирались в 1g.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8
# Параллельная сборка выключена: на машине с 15 ГБ ОЗУ несколько
# воркеров одновременно вытесняют друг друга в swap и сборка идёт дольше.
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8FullMode=true

kotlin.code.style=official
